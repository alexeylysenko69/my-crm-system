<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Hub CRM</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-surface: #1e1e1e;
            --bg-surface-hover: #2c2c2c;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --success: #10b981;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            padding: 0 20px 30px;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .nav-item {
            padding: 15px 20px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--bg-surface-hover);
            color: var(--text-main);
            border-left: 4px solid var(--accent);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
        }

        /* Controls */
        input, button, select, textarea {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.danger { background-color: transparent; border: 1px solid var(--danger); color: var(--danger); }
        button.danger:hover { background-color: var(--danger); color: white; }

        /* Clients Table */
        .search-bar { width: 300px; margin-right: 15px; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--bg-surface);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: var(--bg-surface-hover);
            color: var(--text-muted);
            font-weight: 500;
        }

        tr:hover { background-color: var(--bg-surface-hover); }

        .actions-cell { display: flex; gap: 10px; }

        /* Kanban Board */
        .kanban-board {
            display: flex;
            gap: 20px;
            height: calc(100vh - 150px);
        }

        .kanban-column {
            flex: 1;
            background-color: var(--bg-surface);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .kanban-header {
            padding: 15px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .kanban-cards {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .kanban-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .kanban-card:active { cursor: grabbing; transform: scale(0.98); }
        .kanban-card h3 { font-size: 16px; margin-bottom: 8px; }
        .kanban-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 5px; }
        .kanban-card .price { color: var(--success); font-weight: bold; margin-top: 10px;}

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background-color: var(--bg-surface);
            padding: 30px;
            border-radius: 16px;
            width: 400px;
            border: 1px solid var(--border);
        }

        .modal-content h2 { margin-bottom: 20px; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .modal-actions button.secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">Event Hub CRM</div>
        <div class="nav-item active" onclick="switchTab('clients')">
            👥 Клієнти
        </div>
        <div class="nav-item" onclick="switchTab('funnel')">
            📊 Воронка угод
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Clients Tab -->
        <div id="clients-tab" class="tab-content active">
            <div class="header-actions">
                <h1>Клієнти</h1>
                <div>
                    <input type="text" id="search-client" class="search-bar" placeholder="Пошук за ім'ям або телефоном..." oninput="searchClients()">
                    <button onclick="openClientModal()">+ Додати клієнта</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Ім'я</th>
                        <th>Телефон</th>
                        <th>Email</th>
                        <th>Дії</th>
                    </tr>
                </thead>
                <tbody id="clients-table-body">
                    <!-- Заповнюється через JS -->
                </tbody>
            </table>
        </div>

        <!-- Funnel Tab -->
        <div id="funnel-tab" class="tab-content">
            <div class="header-actions">
                <h1>Воронка угод</h1>
                <button onclick="openDealModal()">+ Створити угоду</button>
            </div>
            
            <div class="kanban-board">
                <!-- Новий -->
                <div class="kanban-column" ondrop="drop(event, 'new')" ondragover="allowDrop(event)">
                    <div class="kanban-header">
                        Новий <span id="count-new">0</span>
                    </div>
                    <div class="kanban-cards" id="stage-new"></div>
                </div>

                <!-- В роботі -->
                <div class="kanban-column" ondrop="drop(event, 'progress')" ondragover="allowDrop(event)">
                    <div class="kanban-header">
                        В роботі <span id="count-progress">0</span>
                    </div>
                    <div class="kanban-cards" id="stage-progress"></div>
                </div>

                <!-- Успішно -->
                <div class="kanban-column" ondrop="drop(event, 'success')" ondragover="allowDrop(event)">
                    <div class="kanban-header">
                        Успішно <span id="count-success">0</span>
                    </div>
                    <div class="kanban-cards" id="stage-success"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal: Client -->
    <div class="modal-overlay" id="client-modal">
        <div class="modal-content">
            <h2 id="client-modal-title">Додати клієнта</h2>
            <input type="hidden" id="client-id">
            <div class="form-group">
                <label>Ім'я та Прізвище</label>
                <input type="text" id="client-name" placeholder="Олексій Лисенко">
            </div>
            <div class="form-group">
                <label>Телефон</label>
                <input type="text" id="client-phone" placeholder="+380...">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="client-email" placeholder="example@mail.com">
            </div>
            <div class="modal-actions">
                <button class="secondary" onclick="closeModals()">Скасувати</button>
                <button onclick="saveClient()">Зберегти</button>
            </div>
        </div>
    </div>

    <!-- Modal: Deal -->
    <div class="modal-overlay" id="deal-modal">
        <div class="modal-content">
            <h2>Нова угода</h2>
            <div class="form-group">
                <label>Назва угоди (Подія)</label>
                <input type="text" id="deal-title" placeholder="Корпоратив, Весілля...">
            </div>
            <div class="form-group">
                <label>Клієнт</label>
                <select id="deal-client">
                    <!-- Заповнюється JS -->
                </select>
            </div>
            <div class="form-group">
                <label>Бюджет (₴)</label>
                <input type="number" id="deal-amount" placeholder="50000">
            </div>
            <div class="modal-actions">
                <button class="secondary" onclick="closeModals()">Скасувати</button>
                <button onclick="saveDeal()">Створити</button>
            </div>
        </div>
    </div>

    <script>
        // Ініціалізація даних з localStorage або пусті масиви
        let clients = JSON.parse(localStorage.getItem('crm_clients')) || [];
        let deals = JSON.parse(localStorage.getItem('crm_deals')) || [];

        // --- НАВІГАЦІЯ ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId + '-tab').classList.add('active');
            event.currentTarget.classList.add('active');
            
            if (tabId === 'funnel') updateDealClientSelect();
        }

        // --- КЛІЄНТИ ---
        function renderClients(data = clients) {
            const tbody = document.getElementById('clients-table-body');
            tbody.innerHTML = '';
            
            data.forEach(client => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${client.name}</td>
                    <td>${client.phone}</td>
                    <td>${client.email}</td>
                    <td class="actions-cell">
                        <button onclick="editClient('${client.id}')">Ред.</button>
                        <button class="danger" onclick="deleteClient('${client.id}')">Видалити</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function searchClients() {
            const query = document.getElementById('search-client').value.toLowerCase();
            const filtered = clients.filter(c => 
                c.name.toLowerCase().includes(query) || 
                c.phone.includes(query)
            );
            renderClients(filtered);
        }

        function saveClient() {
            const idInput = document.getElementById('client-id').value;
            const name = document.getElementById('client-name').value;
            const phone = document.getElementById('client-phone').value;
            const email = document.getElementById('client-email').value;

            if (!name || !phone) return alert('Заповніть обов\'язкові поля (Ім\'я, Телефон)');

            if (idInput) {
                // Редагування
                const index = clients.findIndex(c => c.id === idInput);
                clients[index] = { id: idInput, name, phone, email };
            } else {
                // Створення
                const newClient = { id: 'c_' + Date.now(), name, phone, email };
                clients.push(newClient);
            }

            saveData();
            renderClients();
            closeModals();
        }

        function editClient(id) {
            const client = clients.find(c => c.id === id);
            if (!client) return;

            document.getElementById('client-id').value = client.id;
            document.getElementById('client-name').value = client.name;
            document.getElementById('client-phone').value = client.phone;
            document.getElementById('client-email').value = client.email;
            
            document.getElementById('client-modal-title').innerText = 'Редагувати клієнта';
            document.getElementById('client-modal').classList.add('active');
        }

        function deleteClient(id) {
            if (confirm('Ви впевнені, що хочете видалити цього клієнта?')) {
                clients = clients.filter(c => c.id !== id);
                saveData();
                renderClients();
            }
        }

        function openClientModal() {
            document.getElementById('client-id').value = '';
            document.getElementById('client-name').value = '';
            document.getElementById('client-phone').value = '';
            document.getElementById('client-email').value = '';
            document.getElementById('client-modal-title').innerText = 'Додати клієнта';
            document.getElementById('client-modal').classList.add('active');
        }

        // --- ВОРОНКА УГОД (KANBAN) ---
        function renderDeals() {
            // Очищення колонок
            document.getElementById('stage-new').innerHTML = '';
            document.getElementById('stage-progress').innerHTML = '';
            document.getElementById('stage-success').innerHTML = '';

            let counts = { new: 0, progress: 0, success: 0 };

            deals.forEach(deal => {
                counts[deal.stage]++;
                const client = clients.find(c => c.id === deal.clientId);
                const clientName = client ? client.name : 'Невідомий клієнт';

                const card = document.createElement('div');
                card.className = 'kanban-card';
                card.draggable = true;
                card.id = deal.id;
                card.ondragstart = drag;

                card.innerHTML = `
                    <h3>${deal.title}</h3>
                    <p>👤 ${clientName}</p>
                    <div class="price">₴ ${Number(deal.amount).toLocaleString('uk-UA')}</div>
                    <button class="danger" style="margin-top: 10px; width: 100%; padding: 5px; font-size: 12px;" onclick="deleteDeal('${deal.id}')">Видалити</button>
                `;

                document.getElementById(`stage-${deal.stage}`).appendChild(card);
            });

            // Оновлення лічильників
            document.getElementById('count-new').innerText = counts.new;
            document.getElementById('count-progress').innerText = counts.progress;
            document.getElementById('count-success').innerText = counts.success;
        }

        function updateDealClientSelect() {
            const select = document.getElementById('deal-client');
            select.innerHTML = '<option value="">-- Оберіть клієнта --</option>';
            clients.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.innerText = c.name;
                select.appendChild(opt);
            });
        }

        function openDealModal() {
            if (clients.length === 0) {
                alert('Спочатку додайте хоча б одного клієнта!');
                switchTab('clients');
                return;
            }
            document.getElementById('deal-title').value = '';
            document.getElementById('deal-amount').value = '';
            document.getElementById('deal-modal').classList.add('active');
        }

        function saveDeal() {
            const title = document.getElementById('deal-title').value;
            const clientId = document.getElementById('deal-client').value;
            const amount = document.getElementById('deal-amount').value;

            if (!title || !clientId || !amount) return alert('Заповніть всі поля угоди');

            const newDeal = {
                id: 'd_' + Date.now(),
                title,
                clientId,
                amount,
                stage: 'new' // За замовчуванням потрапляє в "Нові"
            };

            deals.push(newDeal);
            saveData();
            renderDeals();
            closeModals();
        }

        function deleteDeal(id) {
            if(confirm('Видалити угоду?')) {
                deals = deals.filter(d => d.id !== id);
                saveData();
                renderDeals();
            }
        }

        // --- DRAG AND DROP ЛОГІКА ---
        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drop(ev, newStage) {
            ev.preventDefault();
            const dealId = ev.dataTransfer.getData("text");
            const dealIndex = deals.findIndex(d => d.id === dealId);
            
            if (dealIndex > -1) {
                deals[dealIndex].stage = newStage;
                saveData();
                renderDeals();
            }
        }

        // --- СПІЛЬНЕ ---
        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        }

        function saveData() {
            localStorage.setItem('crm_clients', JSON.stringify(clients));
            localStorage.setItem('crm_deals', JSON.stringify(deals));
        }

        // Закриття модалок при кліку на фон
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                closeModals();
            }
        }

        // Ініціалізація при завантаженні сторінки
        window.onload = () => {
            renderClients();
            renderDeals();
            updateDealClientSelect();
        };

    </script>
</body>
</html>
